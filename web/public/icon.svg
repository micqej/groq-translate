<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle inner glow -->
  <rect width="512" height="512" rx="112" fill="url(#glow)" opacity="0.4"/>

  <!-- Globe / language circle -->
  <circle cx="256" cy="220" r="118" stroke="white" stroke-width="14" stroke-opacity="0.15" fill="none"/>
  <ellipse cx="256" cy="220" rx="58" ry="118" stroke="white" stroke-width="14" stroke-opacity="0.15" fill="none"/>
  <line x1="138" y1="220" x2="374" y2="220" stroke="white" stroke-width="14" stroke-opacity="0.15"/>

  <!-- Main "A" letter - bold, centered -->
  <text x="256" y="268" text-anchor="middle" font-family="-apple-system, SF Pro Display, Inter, sans-serif" font-weight="800" font-size="168" fill="white" letter-spacing="-4">A</text>

  <!-- Translation arrows at bottom -->
  <g transform="translate(256, 390)">
    <!-- Left arrow -->
    <path d="M-72 0 L-20 0" stroke="white" stroke-width="12" stroke-linecap="round" stroke-opacity="0.9"/>
    <path d="M-36 -14 L-20 0 L-36 14" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-opacity="0.9"/>
    <!-- Right arrow -->
    <path d="M20 0 L72 0" stroke="white" stroke-width="12" stroke-linecap="round" stroke-opacity="0.9"/>
    <path d="M36 -14 L20 0 L36 14" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-opacity="0.9" transform="rotate(180, 28, 0)"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="6" fill="white" opacity="0.9"/>
  </g>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="white" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
